<div class="auth-card">
  <div class="glyph-wrap">
    <svg width="30" height="30" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 1v9" stroke="#93A0BC" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="6" y="10" width="8" height="6.5" rx="1.8" fill="#FFB224"/>
      <path d="M3.5 18.5h13" stroke="#93A0BC" stroke-width="1.4" stroke-linecap="round" opacity=".4"/>
    </svg>
  </div>
  <h1>Sign in</h1>
  <p class="auth-sub">space-elevator dashboard</p>
  <form method="post" action="/login" class="form">
    <label>Username
      <input type="text" name="username" value="admin" readonly>
    </label>
    <label>Password
      <input type="password" name="password" required autofocus>
    </label>
    <button type="submit">Sign in</button>
  </form>
</div>
