name: release

# Cut a new release only when master moves. The patch version is derived from
# the latest vX.Y.Z tag; binaries for linux/amd64 and linux/arm64 plus
# checksums are attached to a GitHub Release.
on:
  push:
    branches: [master]

# Only one release at a time; never cancel a half-finished publish.
concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to compute the next version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Reruns on an already-released commit must not bump again.
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged $(git describe --tags --exact-match HEAD); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "latest=${latest:-<none>}"
          echo "next=${next}"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: go test ./... && go vet ./...

      - name: Build linux/amd64 and linux/arm64
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.next }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          pkg=github.com/albertoruiz/space-elevator/internal/version
          for arch in amd64 arm64; do
            echo "building linux/${arch} (${VERSION})"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -trimpath \
              -ldflags "-s -w -X ${pkg}.Version=${VERSION} -X ${pkg}.Commit=${COMMIT} -X ${pkg}.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "dist/space-elevator-linux-${arch}" ./cmd/space-elevator
          done

          # Go silently ignores -X for a symbol that does not exist, so a stale
          # ldflags path produces a "dev" binary with no error and no way for
          # `space-elevator update` to compare versions. Assert on the native
          # arch that the stamp matches the tag.
          got="$(./dist/space-elevator-linux-amd64 --version)"
          want="space-elevator version ${VERSION}"
          if [ "$got" != "$want" ]; then
            echo "version stamp mismatch: got '$got', want '$want'" >&2
            exit 1
          fi

          (cd dist && sha256sum space-elevator-linux-* > checksums.txt)
          ls -l dist

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: ${{ steps.version.outputs.next }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/space-elevator-linux-amd64
            dist/space-elevator-linux-arm64
            dist/checksums.txt

      - name: Verify the release is published
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # action-gh-release creates the release as a draft and unmarks it
          # after uploading assets. If that finalize ever fails silently the
          # tag is never created and /releases/latest returns 404, so
          # `space-elevator update` would never see the release. Fail loudly.
          state="$(gh release view "${{ steps.version.outputs.next }}" --json isDraft -q .isDraft)"
          if [ "$state" != "false" ]; then
            echo "release ${{ steps.version.outputs.next }} is still a draft" >&2
            exit 1
          fi
          echo "release ${{ steps.version.outputs.next }} published"
